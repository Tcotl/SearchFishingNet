<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · SearchFishingNet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    /* 深蓝数据网格背景图 + 品牌色遮罩：图在下方，遮罩压暗保证卡片可读 */
    background:
      linear-gradient(160deg, rgba(20, 33, 48, .62) 0%, rgba(18, 40, 62, .55) 55%, rgba(14, 30, 46, .72) 100%),
      url("/login-bg") center / cover no-repeat fixed;
  }
  .card {
    width: 380px;
    background: #fff;
    border-radius: 10px;
    padding: 34px 32px 24px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, .35);
  }
  .brand { display: flex; align-items: center; gap: 12px; margin-bottom: 26px; }
  .logo { font-size: 34px; }
  .name { font-size: 19px; font-weight: 700; color: #1d2b36; }
  .sub { font-size: 12.5px; color: #94a3b8; margin-top: 2px; }
  .field { margin-bottom: 14px; }
  .field input {
    width: 100%;
    padding: 11px 13px;
    border: 1px solid #d7dee5;
    border-radius: 6px;
    font-size: 14px;
    outline: none;
    transition: border .15s;
  }
  .field input:focus { border-color: #2563eb; }
  button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 6px;
    background: #2563eb;
    color: #fff;
    font-size: 15px;
    letter-spacing: 6px;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: #1d4fd8; }
  button:disabled { opacity: .6; cursor: default; }
  .err {
    display: none;
    margin-bottom: 12px;
    padding: 8px 12px;
    border-radius: 6px;
    background: #fef2f2;
    color: #dc2626;
    font-size: 13px;
  }
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <span class="logo">🎣</span>
    <div>
      <div class="name">SearchFishingNet</div>
      <div class="sub">钓鱼网络威胁情报平台 · 独立登录口</div>
    </div>
  </div>
  <div class="err" id="err"></div>
  <form id="form">
    <div class="field"><input id="username" placeholder="用户名" autocomplete="username" autofocus></div>
    <div class="field"><input id="password" type="password" placeholder="口令" autocomplete="current-password"></div>
    <button id="btn" type="submit">登 录</button>
  </form>
</div>
<script>
  const params = new URLSearchParams(location.search)
  const raw = params.get('redirect') || '/dashboard'
  // 仅允许站内路径，防开放重定向
  const target = raw.startsWith('/') && !raw.startsWith('//') ? raw : '/dashboard'

  fetch('/api/auth/me').then(r => { if (r.ok) location.replace(target) })

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault()
    const btn = document.getElementById('btn')
    const err = document.getElementById('err')
    err.style.display = 'none'
    btn.disabled = true
    try {
      const resp = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          username: document.getElementById('username').value.trim(),
          password: document.getElementById('password').value,
        }),
      })
      if (resp.ok) { location.replace(target); return }
      err.textContent = (await resp.json()).detail || '登录失败'
      err.style.display = 'block'
    } catch {
      err.textContent = '后端服务不可达，请确认平台服务已启动'
      err.style.display = 'block'
    } finally { btn.disabled = false }
  })
</script>
</body>
</html>
